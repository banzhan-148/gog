{% extends "base.html" %}
{% block title %}Новый заказ{% endblock %}
{% block content %}
<h1>Новый заказ</h1>
<form method="post" class="form card">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

  <div class="form-grid">
    <label>Клиент *
      <select name="client_id" required>
        <option value="">— выберите —</option>
        {% for c in clients %}
        <option value="{{ c.id }}" {% if selected_client|string == c.id|string %}selected{% endif %}>
          {{ c.full_name }}{% if c.phone %} ({{ c.phone }}){% endif %}
        </option>
        {% endfor %}
      </select>
    </label>
    <label>Исполнитель
      <select name="worker_id">
        <option value="">— не назначен —</option>
        {% for w in workers %}
        <option value="{{ w.id }}">{{ w.full_name }} — {{ w.specialization }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Вид работ *
      <select name="work_type" required>
        {% for t in WORK_TYPES %}<option>{{ t }}</option>{% endfor %}
      </select>
    </label>
    <label>Срок исполнения<input type="date" name="due_date"></label>
  </div>
  <label>Описание<textarea name="description" rows="3" maxlength="1000"></textarea></label>

  <h3>Позиции заказа</h3>
  <table class="table" id="items-table">
    <thead><tr><th>Наименование</th><th>Кол-во</th><th>Цена, ₽</th><th></th></tr></thead>
    <tbody>
      <tr>
        <td><input name="item_name[]" placeholder="Пальто женское" maxlength="128"></td>
        <td><input name="item_qty[]" type="number" min="1" max="10000" value="1" style="width:80px"></td>
        <td><input name="item_price[]" type="number" min="0" step="0.01" value="0" style="width:110px"></td>
        <td><button type="button" class="btn btn-small" onclick="removeRow(this)">✕</button></td>
      </tr>
    </tbody>
  </table>
  <button type="button" class="btn" onclick="addRow()">+ Добавить позицию</button>
  <div class="total">Итого: <b><span id="total">0.00</span> ₽</b></div>

  <button class="btn btn-primary" type="submit">Создать заказ</button>
</form>
{% endblock %}

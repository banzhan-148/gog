{% extends "base.html" %}
{% block title %}Ошибка {{ code }}{% endblock %}
{% block content %}
<div class="error-card">
  <div class="error-code">{{ code }}</div>
  <div class="error-message">{{ message }}</div>
  {% if current_user %}
  <a class="btn btn-primary" href="{{ url_for('dashboard.index') }}">На главную</a>
  {% else %}
  <a class="btn btn-primary" href="{{ url_for('auth.login') }}">Войти</a>
  {% endif %}
</div>
{% endblock %}
